                <span id="erradas" class="kpierradas">Quantidade de erros: </span>
                  <span id="jogadas" class="kpi">Quantidade de <br> tentativas realizadas: </span>
                <span id="pontuacaoFinal" class="kpi">Pontuação Final:</span>
            </div>
            <span class="metricas">Temas de Domínio: <br> Pratico(passos/posições) - 3 questões<br> Cultura(história) - 3 questões</span>
        </div>

  <div class="blocografico">
        <canvas id="myChart"></canvas>
    </div>   

     <div class="header-left">
            <h1>Entre Passos</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>
        
            <div class="btn-nav">
                <a href="./quiz.html">

                <h3>Sair</h3>

</div>

<script>

          var dominio1 = Number(sessionStorage.CERTAS1_ATUAL) 
         var dominio2 = Number(sessionStorage.CERTAS2_ATUAL)
          console.log(dominio1)
         console.log(dominio2)
         var total = dominio1 + dominio2
         
         var dominio1Porcent = dominio1 * 100/6
         var dominio2Porcent = dominio2 * 100/6

    const ctx = document.getElementById('myChart');


  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Prático', 'Cultura'],
      datasets: [{
        label: 'Comparação de Domínio nos Temas (%)',
        data: [dominio1Porcent, dominio2Porcent],
        borderWidth: 3,
        borderColor: '#000000',
        backgroundColor: '#803655',
        
    
      }, ]
    }, 
    options: {
      scales: {
         y: {
      beginAtZero: true,
      max: 50,
      min: 0
    }
      }
    }
  });

function verificar() {
   
    let idUser = sessionStorage.ID_USUARIO


    fetch("/dominio/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        fkUsuarioServer: idUser,
        
      }),
    }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                sessionStorage.ACERTOS_DOMINIO = json.acertos;
                  
                });
            }

            verificar();
        })
      

   document.getElementById("certas").innerHTML = `<br> Acertos: <br> (por jogada) <br> <br> ${Number(sessionStorage.CERTAS1_ATUAL) + Number(sessionStorage.CERTAS2_ATUAL)} <br> perguntas`;
  document.getElementById("erradas").innerHTML = `<br>  Erros: <br>(por jogada)<br> <br>${Number(sessionStorage.ERRADAS1_ATUAL) + Number(sessionStorage.ERRADAS2_ATUAL)} <br> perguntas`;
  document.getElementById("jogadas").innerHTML = `<br> Quantidade de vezes Jogadas: <br> <br>${Number(sessionStorage.JOGADAS_ATUAL)} <br>jogadas`;
  document.getElementById("pontuacaoFinal").innerHTML = `<br> Total de Acertos: <br> <br>${sessionStorage.ACERTOS_DOMINIO}<br> acertos`;
   
    }

</script>
